services:
  n8n:
    image: n8nio/n8n:latest
    container_name: ai-cloud-n8n
    restart: unless-stopped
    ports:
      - "5679:5678"
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET}
      - N8N_DIAGNOSTICS_ENABLED=false
      - N8N_PERSONALIZATION_ENABLED=false
    volumes:
      - ai_cloud_n8n_storage:/home/node/.n8n
      - ./n8n/backup:/backup
    entrypoint: /bin/sh
    command: -c "n8n import:credentials --separate --input=/backup/credentials 2>/dev/null || true; n8n import:workflow --separate --input=/backup/workflows 2>/dev/null || true; n8n start"

volumes:
  ai_cloud_n8n_storage:
