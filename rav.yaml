name: ai-cloud

description: |
  Cloud-native AI agent platform.
  n8n runs in Docker. Backend and frontend run natively during development.

scripts:
  # ============================================================
  # Database Setup
  # ============================================================
  db-setup:
    - source .venv/bin/activate && python scripts/run_sql.py

  # ============================================================
  # n8n (Docker)
  # ============================================================
  n8n:
    - docker compose --env-file .env -f infra/docker-compose.n8n.yml up -d

  n8n-stop:
    - docker compose --env-file .env -f infra/docker-compose.n8n.yml down --volumes

  n8n-logs:
    - docker compose --env-file .env -f infra/docker-compose.n8n.yml logs -f ai-cloud-n8n

  n8n-recreate:
    - docker compose --env-file .env -f infra/docker-compose.n8n.yml up -d --force-recreate n8n

  # ============================================================
  # Agent Backend (native Python)
  # ============================================================
  agent-api:
    - cd apps/agent-backend && uv run python -m uvicorn api:app --reload --port 8001

  agent-api-stop:
    - pkill -f "uvicorn"

  agent-cli:
    - cd apps/agent-backend && uv run python cli.py

  agent-streamlit:
    - cd apps/agent-backend && uv run streamlit run streamlit_ui.py --server.port=8501 --server.address=127.0.0.1

  agent-test:
    - cd apps/agent-backend && uv run pytest tests/ -v

  smoke-test:
    - uv run pytest tests/ -v -k smoke

  coverage:
    - uv run pytest --cov=apps/agent-backend --cov-report=html --cov-report=term -v

  rag-pipeline:
    - cd apps/rag-pipeline && ../../.venv/bin/python main.py --watch ../../shared --interval 5

  rag-pipeline-stop:
    - pkill -9 -f "python.*main\.py.*watch"
    - pkill -9 -f "rag-pipeline"

  agent-streamlit-stop:
    - pkill -f "streamlit"

  frontend-stop:
    - pkill -f "vite"

  # ============================================================
  # Stop Everything
  # ============================================================
  stop-all:
    - rav run agent-api-stop
    - rav run agent-streamlit-stop
    - rav run rag-pipeline-stop
    - rav run frontend-stop
    - rav run n8n-stop

  # ============================================================
  # Agent Frontend (native Node)
  # ============================================================
  frontend:
    - cd apps/agent-frontend && npm run dev

  frontend-build:
    - cd apps/agent-frontend && npm run build

  frontend-install:
    - cd apps/agent-frontend && npm install

  frontend-test:
    - cd apps/agent-frontend && npm test

  frontend-test-coverage:
    - cd apps/agent-frontend && npm run test:coverage

  # ============================================================
  # Full Stack (Docker)
  # ============================================================
  up:
    - docker compose --env-file .env -p ai-cloud -f infra/docker-compose.yml up -d --build

  down:
    - docker compose --env-file .env -p ai-cloud -f infra/docker-compose.yml down --volumes --remove-orphans

  logs:
    - docker compose --env-file .env -p ai-cloud -f infra/docker-compose.yml logs -f

  ps:
    - docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}"

  ps-ai-cloud:
    - docker compose --env-file .env -p ai-cloud -f infra/docker-compose.yml ps

  # ============================================================
  # Utilities
  # ============================================================
  clean:
    - rav run down
    - rav run n8n-stop
    - docker system prune -f
    - docker volume prune -f

  generate-secrets:
    - echo "N8N_ENCRYPTION_KEY=$(openssl rand -base64 32)"
    - echo "N8N_USER_MANAGEMENT_JWT_SECRET=$(openssl rand -base64 32)"
